<!DOCTYPE html>
<html>

<head>

<title>Product Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fa;
}

.product-card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
margin-top:30px;
}

.product-image{
width:100%;
height:400px;
object-fit:cover;
border-radius:15px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/">
⚡ ElectroHub
</a>

<a href="/cart" class="btn btn-warning">
🛒 Cart
</a>

</div>

</nav>

<div class="container">

<div class="product-card">

<div class="row">

<div class="col-md-6">

<img
id="productImage"
src="https://via.placeholder.com/500"
class="product-image">

</div>

<div class="col-md-6">

<h1 id="productName">
Loading...
</h1>

<h3
class="text-success"
id="productPrice">
₹0
</h3>

<p id="productDescription">

Loading Product Description...

</p>

<button
class="btn btn-success"
onclick="addToCart()">

Add To Cart

</button>

<a href="/products"
class="btn btn-secondary">

Back To Products

</a>

</div>

</div>

</div>

</div>

<script>

let productId =
localStorage.getItem("selectedProductId");

loadProduct();

function loadProduct(){

fetch(
"http://localhost:8081/product/" +
productId
)

.then(response=>response.json())

.then(product=>{

document.getElementById(
"productName"
).innerHTML =
product.name;

document.getElementById(
"productPrice"
).innerHTML =
"₹" + product.price;

document.getElementById(
"productDescription"
).innerHTML =
product.description;

document.getElementById(
"productImage"
).src =
product.image ||
"https://via.placeholder.com/500";

})

.catch(error=>{

console.error(error);

alert("Failed To Load Product");

});

}

function addToCart(){

let userId =
localStorage.getItem("userId");

if(!userId){

alert("Please Login First");

window.location.href =
"/login";

return;

}

const cart = {

userId: parseInt(userId),

productId: parseInt(productId),

quantity: 1

};

fetch(
"http://localhost:8081/cart/add",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(cart)

})

.then(response=>response.json())

.then(data=>{

alert("Added To Cart");

})

.catch(error=>{

console.error(error);

alert("Failed To Add Cart");

});

}

</script>

</body>

</html>
