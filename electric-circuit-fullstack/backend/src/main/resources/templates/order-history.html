<!DOCTYPE html>
<html>

<head>

<title>Order History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fa;
}

.card{
padding:20px;
margin-top:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand">
⚡ ElectroHub
</a>

<a href="/products"
class="btn btn-warning">

Products

</a>

</div>

</nav>

<div class="container">

<div class="card">

<h2>
📦 Order History
</h2>

<table class="table table-bordered mt-4">

<thead>

<tr>

<th>Order ID</th>
<th>Total Amount</th>
<th>Status</th>

</tr>

</thead>

<tbody id="orderTable">

</tbody>

</table>

</div>

</div>

<script>

let userId =
localStorage.getItem("userId");

if(!userId){

alert("Please Login First");

window.location.href =
"/login";

}

fetch(
"http://localhost:8081/orders/user/" +
userId
)

.then(response=>response.json())

.then(orders=>{

let html="";

orders.forEach(order=>{

html += `

<tr>

<td>${order.id}</td>

<td>₹${order.totalAmount}</td>

<td>${order.orderStatus}</td>

</tr>

`;

});

document.getElementById(
"orderTable"
).innerHTML = html;

})

.catch(error=>{

console.error(error);

alert("Failed To Load Orders");

});

</script>

</body>

</html>
