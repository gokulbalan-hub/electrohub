<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - ElectroHub</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e293b,#3b82f6);
}

.login-box{
width:450px;
padding:40px;
background:white;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,.3);
}

.form-control{
margin-bottom:15px;
}

.nav-links{
position:fixed;
top:10px;
left:10px;
}

.nav-links a{
margin-right:10px;
color:white;
text-decoration:none;
font-weight:bold;
}

#error{
color:red;
text-align:center;
margin-top:10px;
}

</style>

</head>

<body>
<a href="/logout">
    <button>Logout</button>
</a>
<div class="nav-links">

<a href="/">Home</a>

<a href="/products">Products</a>

<a href="/register">Register</a>

</div>

<div class="login-box">

<h2 class="text-center mb-4">
🔐 Login
</h2>

<input
id="email"
type="email"
class="form-control"
placeholder="Enter Email">
<div id="successBox"
     style="display:none;
     background:#d4edda;
     padding:10px;
     border:1px solid green;">

     Login Successful

</div>
<input
id="password"
type="password"
class="form-control"
placeholder="Enter Password">

<button
class="btn btn-primary w-100"
onclick="login()">

Login

</button>

<div id="error"></div>

<div class="text-center mt-3">

<a href="/register">

Don't have an account?

Register

</a>

</div>

</div>

<script>

function login(){

let loginData = {

email:
document.getElementById("email").value,

password:
document.getElementById("password").value

};

fetch(
"http://localhost:8081/user/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(loginData)

})

.then(response => response.json())

.then(data => {

if(data.message === "SUCCESS"){

localStorage.setItem(
"userId",
data.id
);

localStorage.setItem(
"userName",
data.name
);

localStorage.setItem(
"userRole",
data.role
);



if(data.role === "ADMIN"){

window.location.href =
"/admin";

}
else{

window.location.href =
"/profile";

}

}
else{

document.getElementById(
"error"
).innerHTML =
data.message;

}

})

.catch(error => {

console.error(error);

document.getElementById(
"error"
).innerHTML =
"Login Failed";

});

}
function showSuccess(){

	document.getElementById("successBox")
	.style.display="block";

	setTimeout(function(){

	document.getElementById("successBox")
	.style.display="none";

	},3000);

	}

</script>

</body>

</html>
